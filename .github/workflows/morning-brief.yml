name: Morning Brief - TBS Office (Mon & Fri 10:00 Tbilisi)

on:
  schedule:
    # 06:00 UTC = 10:00 Tbilisi (UTC+4), Mon and Fri only
    - cron: '0 6 * * 1,5'
  workflow_dispatch: # allow manual trigger

jobs:
  deliver-morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate with Nova API
        id: auth
        run: |
          JSON_BODY=$(python3 -c "import json; print(json.dumps({'username': '${{ secrets.NOVA_SA_LOGIN }}', 'password': '${{ secrets.NOVA_SA_PASSWORD }}'}))") 
          RESPONSE=$(curl -s -X POST \
            'https://nova-api.gurtam.com/auth/login' \
            -H 'Content-Type: application/json' \
            -d "$JSON_BODY")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "Auth failed: $RESPONSE"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Invoke Morning Brief
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://nova-api.gurtam.com/proxy/bots/${{ secrets.NOVA_BOT_ID }}/invoke" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -d '{"query": "AUTOMATED SCHEDULED RUN - send morning brief now via Slack DM to all three users. Do NOT ask for confirmation. Send directly without waiting for approval. Address each recipient by first name: davl is Laimonas, kmar is Kmar, taku is Taku. For each brief use this exact format - GOOD MORNING [FirstName]! with todays date, then: TEAM PULSE section with active task count and key highlights, TODAYS HIGHLIGHT with the most important event or achievement, WORKLOAD BY TOPIC with tasks grouped by project tag showing count and bullet sub-items with arrow notation, WHOS OUT TODAY, OUT THIS WEEK, UPCOMING events. Send to: <@D08N4LB4S2V> (Laimonas/davl), <@D07DLM93GD9> (Kmar), <@D07CUKKMSKU> (Taku)."}')
          echo "=== RAW API RESPONSE ==="
          echo "$RESPONSE"
          echo "Morning brief delivered."
